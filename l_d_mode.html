<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark & Light Mode</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            color: black;
            text-align: center;
            padding: 50px;
            transition: 0.3s;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        /* Dark Mode */
        .dark {
            background-color: #121212;
            color: white;
        }
    </style>
</head>

<body>

    <h1>Dark & Light Mode</h1>
    <p>Click the button to change the theme.</p>

    <button onclick="toggleMode()">Toggle Mode</button>

    <script>
        function toggleMode() {
            document.body.classList.toggle("dark");
        }
    </script>

</body>
</html>
